name: Feature request
description: A concrete improvement you'd like to see. For open-ended ideas, start a Discussion first.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution. "Every Monday I have to…" is more helpful than "Add a button that…".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Inlet to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
