# Builds the unsigned universal installer (.pkg, Apple silicon + Intel) and attaches it to a draft GitHub release.
# Push a tag like v1.6.0 to run it, or start it by hand from the Actions tab with a tag name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.5.1'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then echo "Tag $TAG doesn't match package.json version $PKG"; exit 1; fi

      # --publish never: electron-builder would otherwise create its own empty draft release on a tag,
      # and the step below would only upload to it, losing the title and install notes.
      - run: npm run dist -- --publish never

      - name: Attach the installer to a draft release
        run: |
          VERSION="${TAG#v}"
          sed "s/VERSION/$VERSION/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pkg --clobber
          else
            gh release create "$TAG" dist/*.pkg --draft --title "Inlet $VERSION" --notes-file notes.md
          fi
